<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Noter" />
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
    <title>Noter</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app no-anim" id="app" data-view="notes">
      <!-- ============ MAPPER ============ -->
      <section class="screen s-folders" id="screenFolders">
        <header class="nav" data-secret>
          <div class="nav-heading"><span>Mapper</span></div>
          <div class="nav-side"></div>
          <div class="nav-side right">
            <button class="gbtn" type="button" aria-label="Mere">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="4.33" cy="12" r="2" fill="currentColor" stroke="none" />
                <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
                <circle cx="19.67" cy="12" r="2" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>
        </header>

        <div class="scroll" data-scroll="screenFolders">
          <h1 class="large-title">Mapper</h1>
          <div id="folderGroups"></div>
        </div>

        <div class="bar">
          <label class="searchbar">
            <svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.6" cy="10.6" r="6.4" />
              <path d="m15.3 15.3 4.8 4.8" />
            </svg>
            <input type="text" inputmode="numeric" autocomplete="off" autocorrect="off"
                   spellcheck="false" placeholder="Søg" aria-label="Søg" data-secret-search />
            <svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="2.8" width="6" height="11.4" rx="3" />
              <path d="M18 11.6a6 6 0 0 1-12 0" />
              <path d="M12 17.6v3.4" />
            </svg>
          </label>
          <button class="compose" type="button" aria-label="Ny mappe">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.4 7.6a2 2 0 0 1 2-2h3.1l2 2.2h8.1a2 2 0 0 1 2 2v8.6a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2z" />
              <path d="M12 11.4v5.2" />
              <path d="M9.4 14h5.2" />
            </svg>
          </button>
        </div>
      </section>

      <!-- ============ NOTELISTE ============ -->
      <section class="screen s-notes" id="screenNotes">
        <header class="nav" data-secret>
          <div class="nav-heading"><span id="navTitleNotes">Noter</span></div>
          <div class="nav-side">
            <button class="gbtn back" type="button" id="toFolders" aria-label="Mapper">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15.2 4.6 7.8 12l7.4 7.4" />
              </svg>
            </button>
          </div>
          <div class="nav-side right">
            <button class="gbtn" type="button" aria-label="Mere">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="4.33" cy="12" r="2" fill="currentColor" stroke="none" />
                <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
                <circle cx="19.67" cy="12" r="2" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>
        </header>

        <div class="scroll" data-scroll="screenNotes">
          <h1 class="large-title" id="folderTitle">Noter</h1>
          <div class="icloud">
            <svg class="icon cloud" viewBox="0 0 30 21" aria-hidden="true">
              <path d="M8.2 19.6h14.6a5.4 5.4 0 0 0 .7-10.75A7.6 7.6 0 0 0 9.2 6.9a6.4 6.4 0 0 0-1 12.7z" />
              <path d="M15.6 7.2v5.6" />
              <circle cx="15.6" cy="15.9" r="1.05" fill="currentColor" stroke="none" />
            </svg>
            <span>iCloud-lagringsplads næsten fyldt · <b class="link">Få mere</b></span>
          </div>
          <div id="noteGroups"></div>
        </div>

        <div class="bar">
          <label class="searchbar">
            <svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.6" cy="10.6" r="6.4" />
              <path d="m15.3 15.3 4.8 4.8" />
            </svg>
            <input id="noteSearch" type="text" inputmode="numeric" autocomplete="off" autocorrect="off"
                   spellcheck="false" placeholder="Søg" aria-label="Søg i noter" data-secret-search />
            <svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="2.8" width="6" height="11.4" rx="3" />
              <path d="M18 11.6a6 6 0 0 1-12 0" />
              <path d="M12 17.6v3.4" />
            </svg>
          </label>
          <button class="compose" type="button" id="newNoteButton" aria-label="Ny note">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.4 11.4v6.1a2.7 2.7 0 0 1-2.7 2.7H6.5a2.7 2.7 0 0 1-2.7-2.7V7.3a2.7 2.7 0 0 1 2.7-2.7h6.2" />
              <path d="m10.6 13.4 9.2-9.2" />
              <path d="m20.6 3.4.5-.5" />
            </svg>
          </button>
        </div>
      </section>

      <!-- ============ NOTE ============ -->
      <section class="screen s-editor" id="screenEditor">
        <header class="nav" data-secret>
          <div class="nav-heading"><span id="navTitleEditor"></span></div>
          <div class="nav-side">
            <button class="gbtn back" type="button" id="toNotes" aria-label="Tilbage">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15.2 4.6 7.8 12l7.4 7.4" />
              </svg>
            </button>
          </div>
          <div class="nav-side right">
            <div class="gpill">
              <button type="button" aria-label="Del">
                <svg class="icon share" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 14.6V2" />
                  <path d="M7.9 5.9 12 1.8l4.1 4.1" />
                  <path d="M8.3 8.9H6.4a2.2 2.2 0 0 0-2.2 2.2v8.95a2.2 2.2 0 0 0 2.2 2.2h11.2a2.2 2.2 0 0 0 2.2-2.2v-8.95a2.2 2.2 0 0 0-2.2-2.2h-1.9" />
                </svg>
              </button>
              <button type="button" aria-label="Mere">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="4.33" cy="12" r="2" fill="currentColor" stroke="none" />
                  <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
                  <circle cx="19.67" cy="12" r="2" fill="currentColor" stroke="none" />
                </svg>
              </button>
            </div>
          </div>
        </header>

        <div class="scroll" data-scroll="screenEditor" id="notePage"></div>

        <div class="bar">
          <div class="tools">
            <button type="button" aria-label="Tjekliste">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="5.2" cy="7.4" r="3.1" fill="currentColor" stroke="none" />
                <path d="m3.8 7.4 1 1.05 1.9-2.1" style="stroke: var(--bg)" stroke-width="1.5" />
                <circle cx="5.2" cy="16.6" r="2.9" />
                <path d="M10.6 7.4h10.2" />
                <path d="M10.6 16.6h10.2" />
              </svg>
            </button>
            <button type="button" aria-label="Vedhæft billede" id="attachButton">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.7 10.6 11 18.3a4.3 4.3 0 0 1-6.1-6.1l8.4-8.4a2.9 2.9 0 1 1 4.1 4.1l-8.3 8.3a1.5 1.5 0 0 1-2.1-2.1l7.5-7.5" />
              </svg>
            </button>
            <button type="button" aria-label="Markering">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9.2" />
                <path d="M8.6 17.6 12 6.9l3.4 10.7" />
                <path d="M9.9 13.6h4.2" />
              </svg>
            </button>
            <button type="button" aria-label="Skriveværktøjer">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <ellipse cx="11.6" cy="12.4" rx="9.6" ry="5.2" transform="rotate(42 11.6 12.4)" />
                <ellipse cx="11.6" cy="12.4" rx="9.6" ry="5.2" transform="rotate(-30 11.6 12.4)" />
                <path d="m7.4 17.2.6-2.6 8.6-8.6 2 2-8.6 8.6z" />
                <path d="m18.2 4.4 1.6-1.6" />
              </svg>
            </button>
          </div>
          <button class="compose" type="button" aria-label="Ny note" data-new-note>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.4 11.4v6.1a2.7 2.7 0 0 1-2.7 2.7H6.5a2.7 2.7 0 0 1-2.7-2.7V7.3a2.7 2.7 0 0 1 2.7-2.7h6.2" />
              <path d="m10.6 13.4 9.2-9.2" />
              <path d="m20.6 3.4.5-.5" />
            </svg>
          </button>
        </div>
      </section>

      <!-- usynligt langt-tryk-felt (venstre kant, lodret centreret) -->
      <div class="hotspot" id="hotspot" aria-hidden="true"></div>
    </div>

    <!-- ============ FALSK HJEMMESKÆRM (perform) ============ -->
    <div class="home" id="home" aria-hidden="true">
      <div class="home-stage" id="homeStage">
        <div class="home-pages" id="homePages">
          <div class="home-track" id="homeTrack">
            <img src="home/page1.webp" alt="" draggable="false" />
            <img src="home/page2.webp" alt="" draggable="false" />
            <img src="home/page3.webp" alt="" draggable="false" />
          </div>
          <div class="home-press" id="homePress"></div>
        </div>
        <div class="home-dots" id="homeDots">
          <img src="home/dots1.png" alt="" draggable="false" />
          <img src="home/dots2.png" alt="" draggable="false" />
          <img src="home/dots3.png" alt="" draggable="false" />
        </div>
        <img class="home-dock" src="home/dock.webp" alt="" draggable="false" />
      </div>
    </div>

    <input type="file" id="imagePicker" accept="image/*" hidden />

    <!-- ============ PERFORMER ============ -->
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <section class="sheet" id="settingsSheet" aria-hidden="true" aria-label="Performer-indstillinger">
      <div class="grabber"></div>
      <h2 class="sheet-title">Performer</h2>

      <div class="field-card">
        <label class="field">
          <span>Kategori</span>
          <select id="categorySelect"></select>
        </label>
        <label class="field">
          <span>Forudsigelse</span>
          <select id="predictionSelect"></select>
        </label>
      </div>

      <p class="field-note">Hemmelig input</p>
      <div class="field-card">
        <label class="field radio">
          <span>Langt tryk (venstre kant)</span>
          <input type="radio" name="inputMethod" value="longpress" />
          <i class="tick"></i>
        </label>
        <label class="field radio">
          <span>Falsk søgefelt</span>
          <input type="radio" name="inputMethod" value="search" />
          <i class="tick"></i>
        </label>
      </div>

      <p class="field-note">Tilskuerens tal: <b id="currentNumber">–</b></p>
      <p class="field-note diag" id="viewportDiag"></p>

      <button class="primary" id="saveSettings" type="button">OK</button>
      <button class="secondary" id="performButton" type="button">Perform</button>
    </section>

    <section class="pad" id="numberPad" aria-hidden="true" aria-label="Talpanel">
      <div class="pad-display" id="padDisplay">--</div>
      <div class="pad-grid" id="padGrid"></div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
